<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vergê - Formulário</title>

  <!-- Bootstrap via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS próprio -->
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">📖 Vergê</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="tabela.html">Tabela</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="formulario.html">Formulário</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Conteúdo principal -->
  <div class="container mt-4 mb-5">
    <h1 class="text-center mb-3">Envie sua Sugestão de Leitura</h1>
    <p class="text-center mb-4">Preencha o formulário abaixo para indicar um livro para a nossa lista.</p>

    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="form-container">
          <form>

            <!-- Campo de texto -->
            <div class="mb-3">
              <label for="nome" class="form-label">Seu nome</label>
              <input type="text" class="form-control" id="nome" placeholder="Digite seu nome" required>
            </div>

            <!-- Campo de e-mail -->
            <div class="mb-3">
              <label for="email" class="form-label">Seu e-mail</label>
              <input type="email" class="form-control" id="email" placeholder="nome@exemplo.com" required>
            </div>

            <!-- Campo de texto para o livro -->
            <div class="mb-3">
              <label for="livro" class="form-label">Título do livro sugerido</label>
              <input type="text" class="form-control" id="livro" placeholder="Nome do livro">
            </div>

            <!-- Select -->
            <div class="mb-3">
              <label for="genero" class="form-label">Gênero do livro</label>
              <select class="form-select" id="genero">
                <option selected disabled>Selecione um gênero</option>
                <option>Romance</option>
                <option>Fantasia</option>
                <option>Terror</option>
                <option>Biografia</option>
                <option>Ficção Científica</option>
              </select>
            </div>

            <!-- Rádio -->
            <div class="mb-3">
              <label class="form-label d-block">Você já leu este livro?</label>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="jaLeu" id="leuSim" value="sim">
                <label class="form-check-label" for="leuSim">Sim</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="jaLeu" id="leuNao" value="nao">
                <label class="form-check-label" for="leuNao">Não</label>
              </div>
            </div>

            <!-- Checkbox -->
            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="newsletter">
              <label class="form-check-label" for="newsletter">
                Quero receber novidades sobre livros por e-mail
              </label>
            </div>

            <!-- Textarea -->
            <div class="mb-3">
              <label for="mensagem" class="form-label">Por que você recomenda esse livro?</label>
              <textarea class="form-control" id="mensagem" rows="4" placeholder="Conte um pouco sobre o livro..."></textarea>
            </div>

            <!-- Botão de envio -->
            <div class="text-center">
              <button type="submit" class="btn btn-custom px-4">Enviar Sugestão</button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p>Vergê &copy; 2026 - Projeto de faculdade</p>
  </footer>

  <!-- Bootstrap JS via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
